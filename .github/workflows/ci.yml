name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci src
      # Next generates the PageProps / LayoutProps globals that every route file is typed
      # against. Without this step tsc runs before they exist and fails on every route — which
      # it had been doing on every commit, because Typecheck runs before Build.
      - name: Route types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      # The sibling *.check.ts files. Several read real files out of foundry/ — the fork picker
      # against dort-chains.mjs, the vault's share offset against DortSafeVault.sol, the swap's
      # chain id, the Lab fixtures against DortVault.sol, the exporter allow-list against the
      # scripts on disk — so these are what keeps the two halves of the repo in step.
      - name: Unit checks
        run: pnpm check
      - name: Build
        run: pnpm build

  contracts:
    name: Contracts · forge build, test, export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry
    steps:
      - uses: actions/checkout@v4
      # Pinned, because the exporter reads one forge output that moved. forge 1.9 removed the
      # built-in debugger and `--dump` now writes a SolDB bundle directory where 1.8.x wrote a
      # single JSON file, which is what dort-export.mjs decodes into per-line steps. On 1.9 the
      # export still writes its traces and says the step data was skipped, so this pin is about
      # CI testing the whole exporter rather than about the exporter needing 1.8.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: forge build --sizes
      - name: Test (unit + invariant)
        run: forge test -vvv
      - name: Exporter unit tests
        run: node --test *.test.mjs
      - name: Dort export smoke test
        run: node dort-export.mjs --mt test_deposit
